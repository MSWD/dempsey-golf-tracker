<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Middle School Golf Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <img class="logo" src="assets/favicon.svg" alt="">
    <h1>Middle School Golf Tracker</h1>
  </header>

  <main>
    <div class="card">
      <h2>Teams</h2>
      <ul id="team-list"></ul>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="version.js"></script>
  <script>
    async function main() {
      const res = await fetch('teams.json');
      const teams = await res.json();
      const list = document.getElementById('team-list');
      list.innerHTML = Object.entries(teams).map(([slug, team]) =>
        `<li><a href="teams/${slug}/index.html">${team.name}</a></li>`
      ).join('');

      const year = new Date().getFullYear();
      document.getElementById('app-footer').innerHTML = `
        <p><strong>&copy; ${year} MSWD &mdash; Montgomery's Software &amp; Web Development</strong></p>
        <p class="muted">Middle School Golf Tracker &middot; Built with Claude (AI-assisted) &middot; v${APP_VERSION}</p>
      `;
    }
    main();
  </script>
</body>
</html>
