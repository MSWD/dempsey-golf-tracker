name: Check team template drift

on:
  push:
    paths:
      - 'scripts/add-team.py'
      - 'scripts/check-team-templates.py'
      - 'src/teams/**'
      - 'src/teams.json'
  pull_request:
    paths:
      - 'scripts/add-team.py'
      - 'scripts/check-team-templates.py'
      - 'src/teams/**'
      - 'src/teams.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check team templates
        run: python3 scripts/check-team-templates.py
