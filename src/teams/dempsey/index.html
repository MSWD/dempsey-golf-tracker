<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://middle-school-golf-tracker-auth.montgomery-software-and-web-development-account.workers.dev; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Dempsey Golf Tracker</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../css/styles.css">
  <script src="../../assets/vendor/chart.min.js"></script>
</head>
<body>

  <div id="icon-sprite"></div>

  <header class="app-header">
    <a href="../../index.html" class="back-link">&larr; All teams</a>
    <img class="logo" id="team-logo" alt="">
    <h1 id="team-title"></h1>
    <input type="text" id="season-name-input" class="admin-only" placeholder="Season name (e.g. 2026 Dempsey Golf Season)">
    <span id="season-name-display" class="viewer-only muted"></span>
    <div class="header-actions">
      <button id="btn-export" class="admin-only">Export season</button>
      <button id="btn-import" class="admin-only">Import season</button>
      <input type="file" id="file-import" accept="application/json" class="hidden">
      <button id="btn-publish" class="admin-only">Publish report</button>
      <button id="btn-login">Login with GitHub</button>
    </div>
    <div id="login-status" class="muted full-width"></div>
  </header>

  <nav class="tabs">
    <button data-view="roster" class="active">Roster</button>
    <button data-view="courses">Courses</button>
    <button data-view="rounds">Rounds</button>
    <button data-view="rank">Rank</button>
    <button data-view="charts">Charts</button>
    <button data-view="matches">Matches</button>
    <button data-view="help">Help</button>
  </nav>

  <main>
    <section class="view active" id="view-roster"></section>
    <section class="view" id="view-courses"></section>
    <section class="view" id="view-rounds"></section>
    <section class="view" id="view-rank"></section>
    <section class="view" id="view-charts"></section>
    <section class="view" id="view-matches"></section>
    <section class="view" id="view-help"></section>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="team-config.js"></script>
  <script src="../../version.js"></script>
  <script src="../../js/html-utils.js"></script>
  <script src="../../js/models.js"></script>
  <script src="../../js/scoring-engine.js"></script>
  <script src="../../js/data-store.js"></script>
  <script src="../../js/ui-roster.js"></script>
  <script src="../../js/ui-courses.js"></script>
  <script src="../../js/ui-rounds.js"></script>
  <script src="../../js/ui-charts.js"></script>
  <script src="../../js/ui-matches.js"></script>
  <script src="../../js/ui-help.js"></script>
  <script src="../../js/github-auth.js"></script>
  <script src="../../js/github-publish.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
