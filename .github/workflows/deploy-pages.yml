name: Deploy to GitHub Pages

# Deploys on a published GitHub Release (tag), matching the "bump version.js + cut a release per
# feature" workflow — not every push to main, so a deploy is a deliberate, versioned action.
# workflow_dispatch is kept for manually re-deploying the current main without cutting a release.
#
# The push trigger below is intentionally narrow: it fires ONLY on published report data
# (src/teams/*/reports/data/**), which is the sole path the /publish Worker endpoint is allowed to
# write (see worker/cloudflare-device-flow-relay.js's exact-path allowlist in handlePublish) — so
# this can't be widened into "deploy arbitrary code on every push." Without it, clicking "Publish
# report" committed data that never went live until someone separately cut a release — see
# docs/decisions.md.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/teams/*/reports/data/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
