<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Middle School Golf Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <img class="logo" src="assets/favicon.svg" alt="">
    <h1>Middle School Golf Tracker</h1>
  </header>

  <main>
    <div class="card">
      <h2>Teams</h2>
      <ul id="team-list"></ul>
      <p class="muted">
        Coach at another school? <a href="https://github.com/MSWD/dempsey-golf-tracker/blob/main/docs/coach-guide.md#requesting-a-new-team" target="_blank" rel="noopener">See how to get your team added</a>.
      </p>
    </div>
  </main>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="version.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
